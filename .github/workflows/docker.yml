name: Docker image

on:
    push:
        # main publishes :latest for the live site. Other branches publish
        # a :branch-<name> image, so a test container can run them.
        branches: [main, 'claude/**', 'feature/**']
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: image
              run: |
                  echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
                  branch="${GITHUB_REF_NAME//\//-}"
                  if [ "$GITHUB_REF_NAME" = "main" ]; then
                      echo "tag=latest" >> "$GITHUB_OUTPUT"
                  else
                      echo "tag=branch-${branch,,}" >> "$GITHUB_OUTPUT"
                  fi
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
                      ${{ steps.image.outputs.name }}:${{ github.sha }}
